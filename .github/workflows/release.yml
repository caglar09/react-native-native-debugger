name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-master-v2
  cancel-in-progress: true

jobs:
  release:
    name: Build, Release and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn

      - name: Use Yarn 1
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Run tests
        timeout-minutes: 3
        run: yarn test

      - name: Validate CLI syntax
        run: |
          node --check cli/index.js
          node --check cli/logs/index.js
          node --check cli/logs/dashboard.js
          node --check cli/logs/parser.js
          node --check cli/logs/session-store.js
          node --check cli/mcp/index.js
          node --check cli/mcp/dashboard-client.js

      - name: Build dashboard
        run: yarn dashboard:build

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --ignore-scripts
          test -f cli/dashboard/dist/index.html
          test -f cli/mcp/index.js
          test -f cli/mcp/dashboard-client.js

      - name: Build npm tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(npm pack --ignore-scripts --silent | tail -n 1)"
          test -n "${TGZ}"
          test -f "${TGZ}"

          tar -tzf "${TGZ}" > package-contents.txt
          grep -q '^package/cli/dashboard/dist/index.html$' package-contents.txt
          grep -q '^package/cli/mcp/index.js$' package-contents.txt
          grep -q '^package/cli/mcp/dashboard-client.js$' package-contents.txt

          sha256sum "${TGZ}" > "${TGZ}.sha256"

          echo "tgz=${TGZ}" >> "$GITHUB_OUTPUT"
          echo "sha256=${TGZ}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.pack.outputs.tgz }}
            ${{ steps.pack.outputs.sha256 }}
            package-contents.txt
          if-no-files-found: error
          retention-days: 30

      - name: Check existing GitHub release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "${{ steps.meta.outputs.tag }}"             "${{ steps.pack.outputs.tgz }}"             "${{ steps.pack.outputs.sha256 }}"             --target "$GITHUB_SHA"             --title "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}"             --generate-notes             "${EXTRA_ARGS[@]}"

      - name: Note existing GitHub release
        if: steps.release_state.outputs.exists == 'true'
        run: |
          echo "::notice::GitHub release ${{ steps.meta.outputs.tag }} already exists; release creation was skipped."

      - name: Check npm registry
        id: npm_state
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}"

          if npm view "${PACKAGE}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          elif [[ "${NPM_TRUSTED_PUBLISHING:-}" == "true" ]]; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure npm token authentication
        if: steps.npm_state.outputs.exists != 'true' && steps.npm_state.outputs.mode == 'token'
        shell: bash
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm whoami --registry=https://registry.npmjs.org/

      - name: Prepare npm trusted publishing
        if: steps.npm_state.outputs.exists != 'true' && steps.npm_state.outputs.mode == 'trusted'
        run: |
          npm install --global npm@latest
          npm --version

      - name: Publish package to npm
        if: steps.npm_state.outputs.exists != 'true' && steps.npm_state.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${{ steps.pack.outputs.tgz }}"             --registry=https://registry.npmjs.org/             --access public             --provenance

      - name: Note skipped npm publish
        if: steps.npm_state.outputs.exists != 'true' && steps.npm_state.outputs.mode == 'none'
        run: |
          echo "::notice::npm publish skipped. Add repository secret NPM_TOKEN, or set repository variable NPM_TRUSTED_PUBLISHING=true after configuring npm trusted publishing."

      - name: Note existing npm version
        if: steps.npm_state.outputs.exists == 'true'
        run: |
          echo "::notice::${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} already exists on npm; publish was skipped."

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Release"
            echo ""
            echo "- Package: `${{ steps.meta.outputs.name }}`"
            echo "- Version: `${{ steps.meta.outputs.version }}`"
            echo "- Tag: `${{ steps.meta.outputs.tag }}`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- npm mode: `${{ steps.npm_state.outputs.mode || 'unknown' }}`"
            echo "- GitHub release existed: `${{ steps.release_state.outputs.exists || 'unknown' }}`"
            echo "- npm version existed: `${{ steps.npm_state.outputs.exists || 'unknown' }}`"
          } >> "$GITHUB_STEP_SUMMARY"
